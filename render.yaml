services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: bermuda-cocktail-backend
    env: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        value: "*"

  # 2. Frontend Static Web Service (Vite React App)
  - type: web
    name: bermuda-cocktail-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://bermuda-cocktail-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
